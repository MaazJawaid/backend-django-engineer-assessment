<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fuel Route: {{ start_text }} → {{ finish_text }}</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1a1a1a;
    }
    header {
      padding: 12px 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    header .meta {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    #map { height: calc(100vh - 72px); width: 100%; }
    .leaflet-popup-content { font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>{{ start_text }} → {{ finish_text }}</h1>
    <div class="meta">
      {% if feasible %}
        {{ distance_miles }} mi · ${{ total_cost }} fuel · {{ total_gallons }} gal
        · {{ stop_count }} stops planned
      {% else %}
        Infeasible: {{ reason }}
      {% endif %}
    </div>
  </header>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const routeCoords = {{ route_json|safe }};
    const fuelStops = {{ stops_json|safe }};
    const startLat = {{ start_lat }};
    const startLng = {{ start_lng }};
    const finishLat = {{ finish_lat }};
    const finishLng = {{ finish_lng }};

    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);

    // GeoJSON is [lng, lat]; Leaflet wants [lat, lng]
    const latLngs = routeCoords.map((c) => [c[1], c[0]]);
    const polyline = L.polyline(latLngs, { color: "#2563eb", weight: 4, opacity: 0.85 }).addTo(map);

    L.marker([startLat, startLng])
      .addTo(map)
      .bindPopup("<strong>Start</strong>");
    L.marker([finishLat, finishLng])
      .addTo(map)
      .bindPopup("<strong>Finish</strong>");

    const fuelIcon = L.divIcon({
      className: "",
      html: '<div style="background:#16a34a;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">⛽</div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11],
    });

    fuelStops.forEach((stop, idx) => {
      if (stop.latitude == null || stop.longitude == null) return;
      const popup = [
        `<strong>${idx + 1}. ${stop.name || "Fuel stop"}</strong>`,
        `${stop.city || ""}, ${stop.state || ""}`,
        `Mile ${stop.mile_marker}`,
        `$${Number(stop.retail_price).toFixed(3)}/gal`,
        `${Number(stop.gallons).toFixed(2)} gal · $${Number(stop.cost).toFixed(2)}`,
      ].join("<br/>");
      L.marker([stop.latitude, stop.longitude], { icon: fuelIcon })
        .addTo(map)
        .bindPopup(popup);
    });

    if (latLngs.length) {
      map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
    } else {
      map.setView([startLat, startLng], 6);
    }
  </script>
</body>
</html>
